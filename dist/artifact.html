<title>PsychoMirror</title>
<meta name="description" content="Personal Values Card Sort: sort 100 value cards and copy the result with a psychological profile prompt for Claude. EN / RU / HU / SR.">
<style>
/* Layout: one centred column under a sticky bar; while sorting, the column widens into a game board: four decks on top, the dealt hand below. */
:root {
  --bg: #ECEFF2;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --ink: #17202A;
  --muted: #586474;
  --line: #D2D9E1;
  --accent: #1C6A59;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEDE8;
  --warn: #8F5600;
  --warn-soft: #F6E8D2;
  --p0: #A3ADB8; --p1: #93BDB0; --p2: #5DA08D; --p3: #2F8069; --p4: #165A4A; --pu: #C2974B;
  --shadow: 0 1px 2px rgba(23, 32, 42, .06), 0 8px 28px rgba(23, 32, 42, .08);
  --serif: Georgia, "PT Serif", "Noto Serif", "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151A; --surface: #182029; --surface-2: #1D2630; --ink: #E4E9EF; --muted: #97A3B2; --line: #2B3540;
    --accent: #5DC3A6; --accent-ink: #0B1915; --accent-soft: #1C3530; --warn: #E3AA52; --warn-soft: #3A2D18;
    --p0: #4A5563; --p1: #3C6A5E; --p2: #3E8D77; --p3: #4FB195; --p4: #86DCC3; --pu: #CFA65E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151A; --surface: #182029; --surface-2: #1D2630; --ink: #E4E9EF; --muted: #97A3B2; --line: #2B3540;
  --accent: #5DC3A6; --accent-ink: #0B1915; --accent-soft: #1C3530; --warn: #E3AA52; --warn-soft: #3A2D18;
  --p0: #4A5563; --p1: #3C6A5E; --p2: #3E8D77; --p3: #4FB195; --p4: #86DCC3; --pu: #CFA65E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; margin-right: auto; background: none; border: 0; padding: 4px 0; cursor: pointer; }
.brand span { color: var(--accent); }
.steps { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--muted); }
.steps button { border: 0; background: none; font: inherit; color: inherit; padding: 3px 8px; border-radius: 999px; cursor: pointer; }
.steps button:hover:not(:disabled) { color: var(--ink); background: var(--surface-2); }
.steps button:disabled { opacity: .45; cursor: default; }
.steps li.on button { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
main a, .sheet a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
.prompt-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
.prompt-btn:hover { border-color: var(--muted); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.lang button { border: 0; background: none; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .06em; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(32px, 6vw, 46px); line-height: 1.1; margin: 0 0 14px; text-wrap: balance; }
h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(24px, 4.4vw, 30px); line-height: 1.2; margin: 0 0 8px; text-wrap: balance; }
h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 700; }
.lede { font-size: 18px; color: var(--muted); max-width: 60ch; margin: 0 0 28px; }
p { margin: 0; }
.stack { display: grid; gap: 28px; }
.small { font-size: 13px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 12px 20px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { background: none; border-color: transparent; color: var(--muted); padding-inline: 10px; }
.btn.quiet:hover { color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* index card */
.card {
  position: relative; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 38px 28px 30px; border-top: 4px solid var(--accent); min-height: 220px; min-width: 0; display: flex; flex-direction: column; gap: 14px;
}
.card .no { position: absolute; top: 14px; right: 18px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.card .name { font-size: clamp(28px, 6.5vw, 42px); font-weight: 750; letter-spacing: .03em; line-height: 1.1; text-transform: uppercase; color: var(--ink); overflow-wrap: normal; hyphens: manual; text-wrap: balance; }
.card .def { font-family: var(--serif); font-size: clamp(17px, 3.4vw, 20px); line-height: 1.4; color: var(--muted); text-wrap: pretty; }
.nw { white-space: nowrap; }
.card.example { min-height: 0; max-width: 420px; }
.card.example .name { font-size: 28px; }
.card.example .def { font-size: 17px; }
.card.enter { animation: enter .22s ease-out; }
@keyframes enter { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }

.intro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.intro-grid > * { min-width: 0; }
ol.how { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
ol.how li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
ol.how li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--ink); font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.note { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; color: var(--muted); font-size: 14px; max-width: 62ch; }

/* sorting: a game board of four decks above the hand of five dealt cards */
body.wide .bar-in, body.wide main, body.wide footer { max-width: 1040px; }
.progress { display: grid; gap: 8px; }
.progress .meta { display: flex; gap: 12px; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .2s; }
.lvl { display: flex; gap: 3px; align-items: center; min-height: 12px; }
.lvl b { font-size: 14px; line-height: 1; color: var(--pc); }
.lvl i { width: 10px; height: 4px; border-radius: 2px; background: var(--line); }
.lvl i.f { background: var(--pc); }
.hand {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; padding: 14px 16px 16px; min-height: 176px;
  border-radius: var(--radius); background: var(--surface-2); border: 1.5px dashed transparent; transition: border-color .1s;
}
.hand.over { border-color: var(--accent); }
.hand .done { grid-column: 1 / -1; display: grid; gap: 12px; place-items: center; align-content: center; text-align: center; color: var(--muted); }
.hcard {
  display: flex; flex-direction: column; gap: 8px; min-height: 146px; padding: 12px 12px 14px; text-align: left; border: 0;
  background: var(--surface); border-radius: 12px; border-top: 4px solid var(--accent); box-shadow: var(--shadow);
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  transform: rotate(var(--r, 0deg)); transition: transform .15s, box-shadow .15s;
}
.hcard:hover { transform: translateY(-4px) rotate(var(--r, 0deg)); }
.hcard[aria-pressed="true"] { transform: translateY(6px); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.hcard .no { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.hcard .name { font-size: 14px; font-weight: 750; letter-spacing: .02em; line-height: 1.15; text-transform: uppercase; }
.hcard .def { font-family: var(--serif); font-size: 14px; line-height: 1.35; color: var(--muted); text-wrap: pretty; }
.hcard.deal { animation: deal .32s ease-out backwards; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes deal { from { transform: translateY(-28px); opacity: 0; } }
.hand-info { display: none; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* the board: four columns filling the rest of the screen; buried cards show as title strips that thin out as a pile grows */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; height: max(340px, 62vh); height: max(340px, 62dvh); }
.col {
  display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; padding: 8px; cursor: pointer;
  border-radius: var(--radius); background: color-mix(in srgb, var(--pc) 7%, var(--surface-2)); border: 1.5px dashed transparent;
  transition: border-color .1s, background-color .1s;
}
.col:hover, .col.over { border-color: var(--pc); }
.col.over { background: color-mix(in srgb, var(--pc) 18%, var(--surface-2)); }
.col-h { display: flex; align-items: center; gap: 8px; min-height: 20px; padding: 0 2px; }
.col-h .t { font-weight: 600; font-size: 14px; line-height: 1.2; max-width: 100%; overflow-wrap: anywhere; }
.col-h .n { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.col-h kbd { font: 11px/1.4 var(--sans); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.cascade { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.cascade .hint { flex: 1; display: grid; place-items: center; border: 1.5px dashed var(--line); border-radius: 12px; }
.cascade .hint .lvl { transform: scale(1.6); opacity: .8; }
.strip {
  flex: none; display: block; width: 100%; height: var(--strip, 26px); padding: 0 10px; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-top: 2px solid var(--pc); border-radius: 9px 9px 0 0;
  font-size: clamp(7px, calc(var(--strip, 26px) * .52), 12px); line-height: calc(var(--strip, 26px) - 3px); font-weight: 700; letter-spacing: .03em;
  text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  box-shadow: 0 -2px 4px rgba(23, 32, 42, .05);
}
.strip:hover { color: var(--ink); }
.thin .strip { color: transparent; }
.top-card {
  flex: none; display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 12px; text-align: left;
  background: var(--surface); border-radius: 10px; border-top: 4px solid var(--pc); box-shadow: var(--shadow);
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.top-card .name { font-size: 13px; font-weight: 750; letter-spacing: .03em; line-height: 1.15; text-transform: uppercase; }
.top-card .def { font-family: var(--serif); font-size: 13.5px; line-height: 1.35; color: var(--muted); text-wrap: pretty; }
.top-card.land { animation: land .25s ease-out; }
@keyframes land { from { transform: translateY(-14px) scale(1.04); opacity: .5; } to { transform: none; opacity: 1; } }
.lifted { opacity: .25; }
.ghost { position: fixed; z-index: 60; margin: 0; pointer-events: none; transition: none; box-shadow: 0 18px 44px rgba(10, 14, 18, .28); }

/* review */
.piles { display: grid; gap: 14px; }
.pile { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); padding: 14px 16px 16px; }
.pile.drop { border-color: var(--accent); background: var(--accent-soft); }
.pile-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--pc); flex: none; }
.pile-h b { font-size: 15px; }
.pile-h .n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 9px; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; cursor: pointer; }
.chip:hover { border-color: var(--pc); }
.chip[draggable="true"] { cursor: grab; }
.empty { font-size: 13px; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.status.ok { background: var(--accent-soft); }
.status.bad { background: var(--warn-soft); color: var(--warn); }
.sticky-foot {
  position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between;
}

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 18, .45); z-index: 40; display: grid; place-items: end center; padding: 16px; }
@media (min-width: 640px) { .scrim { place-items: center; } }
.sheet { width: min(520px, 100%); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 14px; max-height: 90vh; overflow: auto; }
.sheet.wide { width: min(760px, 100%); }
.sheet .name { min-width: 0; font-size: 26px; font-weight: 750; letter-spacing: .03em; line-height: 1.15; text-transform: uppercase; overflow-wrap: normal; hyphens: manual; }
.sheet .def { font-family: var(--serif); font-size: 17px; line-height: 1.4; color: var(--muted); }
.move { display: grid; gap: 6px; }
.move button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.move button:hover { border-color: var(--pc); }
.move button[aria-current="true"] { background: var(--surface-2); font-weight: 600; }
.move button .cur { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }

/* rank */
ol.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ol.rank li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 12px 14px; }
ol.rank .num { font-family: var(--serif); font-size: 26px; color: var(--accent); font-variant-numeric: tabular-nums; text-align: center; }
ol.rank .txt { min-width: 0; }
ol.rank .txt b { display: block; font-size: 13px; letter-spacing: .1em; }
ol.rank .txt span { font-size: 14px; color: var(--muted); }
.arrows { display: flex; gap: 4px; }
.arrows button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 16px; line-height: 1; }
.arrows button:disabled { opacity: .3; cursor: default; }

/* result */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.toplist { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.toplist li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: baseline; }
.toplist .num { font-family: var(--serif); color: var(--accent); font-size: 18px; text-align: right; font-variant-numeric: tabular-nums; }
.toplist.plain li { grid-template-columns: 1fr; }
.toplist b { font-size: 13px; letter-spacing: .08em; }
.toplist span { color: var(--muted); font-size: 14px; }
.dist { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; margin-bottom: 10px; }
.dist i { background: var(--pc); min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.poles { display: grid; gap: 12px; }
.pole { display: grid; grid-template-columns: minmax(0, 11rem) 1fr 3.5rem; gap: 12px; align-items: center; font-size: 14px; }
.pole .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.pole .b { position: relative; height: 10px; background: var(--surface-2); border-radius: 999px; }
.pole .b::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.pole .b i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; }
.pole .b i.neg { background: var(--p0); }
.copy-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.copy-btn { text-align: left; display: grid; gap: 4px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.copy-btn:hover { border-color: var(--muted); }
.copy-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.copy-btn b { font-size: 15px; }
.copy-btn span { font-size: 13px; opacity: .8; }
.copy-btn[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent) inset; }
.copy-btn.primary[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink) inset; }
.toast { min-height: 1.5em; font-size: 14px; font-weight: 600; color: var(--accent); }
.toast.bad { color: var(--warn); }
textarea { width: 100%; min-height: 260px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface-2); color: var(--ink); font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.confirm { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--warn-soft); padding: 10px 14px; border-radius: 12px; }
footer { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; font-size: 12px; color: var(--muted); }

@media (max-width: 640px) {
  .intro-grid { grid-template-columns: 1fr; }
  .bar { position: static; }
  .steps { order: 5; width: 100%; }
  .steps li { flex: 1; }
  .steps button { width: 100%; padding: 6px 4px; }
  .hand { gap: 6px; padding: 8px; min-height: 0; }
  /* five across is too narrow for titles, so on phones they run up the card like a book spine */
  .hcard { min-height: 0; height: 136px; padding: 8px 4px; gap: 0; align-items: center; justify-content: center; transform: rotate(calc(var(--r, 0deg) / 2)); }
  .hcard:hover { transform: rotate(calc(var(--r, 0deg) / 2)); }
  .hcard .no, .hcard .def { display: none; }
  .hcard .name { writing-mode: vertical-rl; transform: rotate(180deg); height: 100%; font-size: 12px; line-height: 1.1; letter-spacing: .02em; text-align: center; }
  .hand-info { display: block; min-height: 2.8em; margin-top: 8px; font-size: 14px; line-height: 1.4; color: var(--muted); }
  .hand-info b { color: var(--ink); letter-spacing: .03em; }
  /* four columns leave no room for titles on a phone: the decks sit 2 x 2 */
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; height: max(480px, 84vh); height: max(480px, 84dvh); }
  .col { padding: 6px; gap: 6px; }
  .col-h .t { font-size: 13px; }
  .col-h kbd { display: none; }
  .strip { padding: 0 8px; border-radius: 8px 8px 0 0; }
  .top-card { padding: 8px 8px 10px; gap: 4px; }
  .top-card .name { font-size: 12px; }
  .top-card .def { font-size: 12.5px; line-height: 1.3; }
  .copy-grid { grid-template-columns: 1fr; }
  .pole { grid-template-columns: 1fr 3.5rem; }
  .pole .b { grid-column: 1 / -1; grid-row: 2; }
  .card { padding: 36px 20px 24px; min-height: 180px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<header class="bar"><div class="bar-in">
  <button class="brand" type="button" data-act="home">Psycho<span>Mirror</span></button>
  <ol class="steps" id="steps"></ol>
  <button class="prompt-btn" type="button" data-act="show-prompt" id="prompt-btn"></button>
  <div class="lang" role="group" aria-label="Language" id="lang"></div>
</div></header>
<main id="app" aria-live="polite"></main>
<footer id="foot"></footer>

const PROMPTS = {"en":"# Task: Psychological Analysis of a Values Profile\n\nBased on the provided distribution of values across 4 decks, compile a professional psychological analysis of the personality profile.\n\n## Source Data\n\nThe respondent distributed 100 values (Personal Values Card Sort, W. R. Miller et al., 2011) into 4 decks by importance: \"Very important\", \"Important\", \"Unsure\", \"Not important\". Each value has a name and a short clarifying definition; the respondent sorted mainly by the name.\n\nThe full sorting data is at the end of this message: all four decks with definitions, and index scores for the four poles of the Schwartz model, calculated by software (the method is described in the data).\n\n## Analysis Requirements\n\nConduct a comprehensive psychological analysis covering the following aspects:\n\n### 1. Values Structure\n- Dominant value orientations\n- Hierarchy of priorities\n- Identified value clusters (social, personal, material, etc.)\n\n### 2. Personality Profile\n- Key personality traits manifested through value choices\n- Motivational structure\n- Characteristics of self-perception and identity\n\n### 3. Behavioral Patterns and Attitudes\n- Expected behavioral strategies\n- Attitude toward social interactions\n- Balance between individual and collective\n\n### 4. Areas of Conflict and Tension\n- Potential internal contradictions between values\n- Areas of possible life difficulties\n- Adaptation challenges\n\n### 5. Resources and Strengths\n- Constructive aspects of the profile\n- Development potential\n- Personality protective factors\n\n### 6. Socialization Context (optional)\n- Possible cultural and social influences on values formation\n- Signs of certain life stages or contexts\n- **Important**: analysis without direct categorization by gender/age, only description of sociocultural patterns\n\n### 7. Professional Fulfilment\n- Professional fields and roles in which the respondent's values are most likely to find expression: 5–8 specific examples, each with a rationale\n- Work environment, work format and management style in which the respondent is likely to be most effective\n- Environments and roles likely to cause inner resistance\n\n### 8. Relationships and Interaction\n- What is likely to matter most to the respondent in close relationships, friendship and teams\n- Possible sources of tension when interacting with people who hold different values\n\n### 9. Recommendations\n- Practical recommendations for development and for using strengths\n- Ways to work with the identified areas of tension\n- 3–5 questions for self-reflection\n\n## Response Format\n\nA structured psychological report in English using professional terminology. Start with a short profile summary (5–7 sentences). Length: 1500–2200 words.\n\nConclusions should be:\n- Justified through analysis of value choices, with reference to specific values\n- Balanced (strengths + development areas)\n- Ethical and non-stigmatizing\n- Based on recognized psychological theories (e.g., Schwartz's Theory of Basic Values, Self-Determination Theory, etc.)\n\n## Limitations\n\n- Avoid categorical statements\n- Use formulations like \"may indicate\", \"characteristic of\", \"likely\"\n- Do not make medical diagnoses\n- Maintain professional distance and objectivity\n\n## Sorting Data\n\n{{LAYOUT}}\n","ru":"# Задание: Психологический анализ профиля ценностей\n\nНа основе предоставленного распределения ценностей по 4 колодам составьте профессиональный психологический анализ личностного профиля.\n\n## Исходные данные\n\nРеспондент распределил 100 ценностей (методика Personal Values Card Sort, W. R. Miller и соавт., 2011) на 4 колоды по степени важности: «Очень важно», «Важно», «Сложно сказать», «Не важно». У каждой ценности есть название и короткое уточняющее определение; респондент выбирал прежде всего по названию.\n\nПолные данные расклада приведены в конце сообщения: все четыре колоды с определениями и индексы четырёх полюсов модели Шварца, вычисленные программой (метод описан в данных).\n\n## Требования к анализу\n\nПроведите комплексный психологический анализ, включающий следующие аспекты:\n\n### 1. Структура ценностей\n- Доминирующие ценностные ориентации\n- Иерархия приоритетов\n- Выявленные кластеры ценностей (социальные, личностные, материальные и т.д.)\n\n### 2. Личностный профиль\n- Ключевые личностные черты, проявляющиеся через выбор ценностей\n- Мотивационная структура\n- Особенности самовосприятия и идентичности\n\n### 3. Паттерны поведения и установки\n- Предполагаемые поведенческие стратегии\n- Отношение к социальным взаимодействиям\n- Баланс между индивидуальным и коллективным\n\n### 4. Зоны конфликта и напряжения\n- Потенциальные внутренние противоречия между ценностями\n- Области возможных жизненных затруднений\n- Адаптационные вызовы\n\n### 5. Ресурсы и сильные стороны\n- Конструктивные аспекты профиля\n- Потенциал для развития\n- Защитные факторы личности\n\n### 6. Контекст социализации (опционально)\n- Возможные культурные и социальные влияния на формирование ценностей\n- Признаки определённых жизненных этапов или контекстов\n- **Важно**: анализ без прямой категоризации по полу/возрасту, только описание социокультурных паттернов\n\n### 7. Профессиональная реализация\n- Профессиональные сферы и роли, в которых ценности респондента вероятнее всего найдут реализацию: 5–8 конкретных примеров, каждый с обоснованием\n- Рабочая среда, формат работы и стиль руководства, в которых респондент, вероятно, будет наиболее эффективен\n- Среды и роли, которые, вероятно, будут вызывать внутреннее сопротивление\n\n### 8. Отношения и взаимодействие\n- Что, вероятно, особенно важно для респондента в близких отношениях, дружбе и команде\n- Возможные источники напряжения во взаимодействии с людьми с иными ценностями\n\n### 9. Рекомендации\n- Практические рекомендации по развитию и использованию сильных сторон\n- Способы работы с выявленными зонами напряжения\n- 3–5 вопросов для саморефлексии\n\n## Формат ответа\n\nСтруктурированный психологический отчёт на русском языке с использованием профессиональной терминологии. Начните с краткого резюме профиля (5–7 предложений). Объём: 1500–2200 слов.\n\nВыводы должны быть:\n- Обоснованными через анализ ценностных выборов, со ссылкой на конкретные ценности\n- Сбалансированными (сильные стороны + зоны развития)\n- Этичными и не стигматизирующими\n- Опирающимися на признанные психологические теории (например, теория ценностей Шварца, теория самодетерминации и др.)\n\n## Ограничения\n\n- Избегайте категоричных утверждений\n- Используйте формулировки \"может указывать на\", \"характерно для\", \"вероятно\"\n- Не делайте медицинских диагнозов\n- Сохраняйте профессиональную дистанцию и объективность\n\n## Данные расклада\n\n{{LAYOUT}}\n","hu":"# Feladat: Az értékprofil pszichológiai elemzése\n\nAz értékek 4 kupac szerinti megoszlása alapján készíts szakmai pszichológiai elemzést a személyiségprofilról.\n\n## Kiinduló adatok\n\nA válaszadó 100 értéket (Personal Values Card Sort, W. R. Miller és mtsai, 2011) osztott szét 4 kupacba fontosság szerint: „Nagyon fontos”, „Fontos”, „Bizonytalan”, „Nem fontos”. Minden értéknek van neve és rövid, pontosító meghatározása; a válaszadó elsősorban a név alapján döntött.\n\nA válogatás teljes adatai az üzenet végén találhatók: mind a négy kupac a meghatározásokkal, valamint a Schwartz-modell négy pólusának programmal számított indexei (a módszer leírása az adatok között szerepel).\n\n## Az elemzés követelményei\n\nKészíts átfogó pszichológiai elemzést a következő szempontok szerint:\n\n### 1. Az értékek szerkezete\n- Domináns értékorientációk\n- A prioritások hierarchiája\n- Azonosított értékcsoportok (társas, személyes, anyagi stb.)\n\n### 2. Személyiségprofil\n- Az értékválasztásokban megnyilvánuló fő személyiségvonások\n- Motivációs szerkezet\n- Az énkép és az identitás sajátosságai\n\n### 3. Viselkedési minták és attitűdök\n- Feltételezhető viselkedési stratégiák\n- Viszonyulás a társas interakciókhoz\n- Az egyéni és a közösségi egyensúlya\n\n### 4. Konfliktus- és feszültségzónák\n- Lehetséges belső ellentmondások az értékek között\n- Lehetséges élethelyzeti nehézségek területei\n- Alkalmazkodási kihívások\n\n### 5. Erőforrások és erősségek\n- A profil építő vonatkozásai\n- Fejlődési potenciál\n- A személyiség védőfaktorai\n\n### 6. Szocializációs háttér (opcionális)\n- Lehetséges kulturális és társadalmi hatások az értékek kialakulására\n- Bizonyos életszakaszokra vagy élethelyzetekre utaló jelek\n- **Fontos**: nem és életkor szerinti közvetlen besorolás nélkül, csak szociokulturális mintázatok leírása\n\n### 7. Szakmai kibontakozás\n- Szakterületek és szerepek, amelyekben a válaszadó értékei a legvalószínűbben érvényesülhetnek: 5–8 konkrét példa, mindegyik indoklással\n- Munkakörnyezet, munkaforma és vezetési stílus, amelyben a válaszadó valószínűleg a leghatékonyabb\n- Környezetek és szerepek, amelyek valószínűleg belső ellenállást váltanak ki\n\n### 8. Kapcsolatok és együttműködés\n- Mi lehet különösen fontos a válaszadónak a szoros kapcsolatokban, a barátságban és a csapatban\n- A feszültség lehetséges forrásai más értékeket valló emberekkel való kapcsolatban\n\n### 9. Ajánlások\n- Gyakorlati ajánlások a fejlődéshez és az erősségek kiaknázásához\n- Módszerek az azonosított feszültségzónák kezelésére\n- 3–5 kérdés az önreflexióhoz\n\n## A válasz formája\n\nStrukturált pszichológiai beszámoló magyarul, szakmai terminológiával. Kezdd a profil rövid összefoglalásával (5–7 mondat). Terjedelem: 1500–2200 szó.\n\nA következtetések legyenek:\n- Az értékválasztások elemzésével alátámasztottak, konkrét értékekre hivatkozva\n- Kiegyensúlyozottak (erősségek + fejlesztendő területek)\n- Etikusak és nem stigmatizálók\n- Elismert pszichológiai elméletekre épülők (például Schwartz alapérték-elmélete, az önmeghatározás-elmélet stb.)\n\n## Korlátozások\n\n- Kerüld a kategorikus állításokat\n- Használj olyan megfogalmazásokat, mint „utalhat arra”, „jellemző rá”, „valószínűleg”\n- Ne állíts fel orvosi diagnózist\n- Őrizd meg a szakmai távolságot és az objektivitást\n\n## A válogatás adatai\n\n{{LAYOUT}}\n","sr":"# Zadatak: Psihološka analiza profila vrednosti\n\nNa osnovu datog rasporeda vrednosti u 4 špila, sastavite profesionalnu psihološku analizu profila ličnosti.\n\n## Polazni podaci\n\nIspitanik je rasporedio 100 vrednosti (metodika Personal Values Card Sort, W. R. Miller i sar., 2011) u 4 špila prema važnosti: „Veoma važno“, „Važno“, „Teško je reći“, „Nije važno“. Svaka vrednost ima naziv i kratko pojašnjenje; ispitanik je birao pre svega prema nazivu.\n\nPotpuni podaci rasporeda nalaze se na kraju poruke: sva četiri špila sa pojašnjenjima i indeksi četiri pola Švarcovog modela, izračunati programom (metod je opisan u podacima).\n\n## Zahtevi za analizu\n\nSprovedite sveobuhvatnu psihološku analizu koja obuhvata sledeće aspekte:\n\n### 1. Struktura vrednosti\n- Dominantne vrednosne orijentacije\n- Hijerarhija prioriteta\n- Uočeni klasteri vrednosti (socijalni, lični, materijalni itd.)\n\n### 2. Profil ličnosti\n- Ključne crte ličnosti koje se ispoljavaju kroz izbor vrednosti\n- Motivaciona struktura\n- Osobenosti samopercepcije i identiteta\n\n### 3. Obrasci ponašanja i stavovi\n- Pretpostavljene strategije ponašanja\n- Odnos prema socijalnim interakcijama\n- Ravnoteža između individualnog i kolektivnog\n\n### 4. Zone konflikta i napetosti\n- Potencijalne unutrašnje protivrečnosti između vrednosti\n- Oblasti mogućih životnih teškoća\n- Adaptacioni izazovi\n\n### 5. Resursi i snage\n- Konstruktivni aspekti profila\n- Potencijal za razvoj\n- Zaštitni faktori ličnosti\n\n### 6. Kontekst socijalizacije (opciono)\n- Mogući kulturni i društveni uticaji na formiranje vrednosti\n- Znaci određenih životnih faza ili konteksta\n- **Važno**: analiza bez direktnog kategorisanja po polu/uzrastu, samo opis sociokulturnih obrazaca\n\n### 7. Profesionalna realizacija\n- Profesionalne oblasti i uloge u kojima će vrednosti ispitanika najverovatnije naći izraz: 5–8 konkretnih primera, svaki sa obrazloženjem\n- Radno okruženje, format rada i stil rukovođenja u kojima će ispitanik verovatno biti najefikasniji\n- Okruženja i uloge koje će verovatno izazivati unutrašnji otpor\n\n### 8. Odnosi i interakcija\n- Šta je ispitaniku verovatno posebno važno u bliskim odnosima, prijateljstvu i timu\n- Mogući izvori napetosti u interakciji s ljudima drugačijih vrednosti\n\n### 9. Preporuke\n- Praktične preporuke za razvoj i korišćenje snaga\n- Načini rada sa uočenim zonama napetosti\n- 3–5 pitanja za samorefleksiju\n\n## Format odgovora\n\nStrukturisani psihološki izveštaj na srpskom jeziku (latinica), uz upotrebu stručne terminologije. Počnite kratkim rezimeom profila (5–7 rečenica). Obim: 1500–2200 reči.\n\nZaključci treba da budu:\n- Obrazloženi analizom vrednosnih izbora, uz pozivanje na konkretne vrednosti\n- Uravnoteženi (snage + oblasti za razvoj)\n- Etični i nestigmatizujući\n- Zasnovani na priznatim psihološkim teorijama (na primer, Švarcova teorija osnovnih vrednosti, teorija samodeterminacije i dr.)\n\n## Ograničenja\n\n- Izbegavajte kategorične tvrdnje\n- Koristite formulacije „može ukazivati na“, „karakteristično za“, „verovatno“\n- Ne postavljajte medicinske dijagnoze\n- Zadržite profesionalnu distancu i objektivnost\n\n## Podaci rasporeda\n\n{{LAYOUT}}\n"};

/* ---------- state ---------- */
function fresh(lang) {
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  return { v: 3, lang, step: "intro", seed, order: shuffled(CARDS.map(c => c.key), seed), piles: {}, hand: [], placed: [], hist: [], date: today() };
}
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function shuffled(arr, seed) {
  let a = seed >>> 0;
  const rnd = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if (s && (s.v === 2 || s.v === 3) && Array.isArray(s.order) && s.order.length === CARDS.length && s.order.every(k => BY_KEY[k])) {
      if (s.v === 2) {                               // one-card-at-a-time sort: keep the piles, deal the rest as a hand
        Object.assign(s, { v: 3, hand: [], hist: [], placed: s.order.filter(k => s.piles[k] !== undefined) });
        delete s.idx;
      }
      if (Array.isArray(s.hand) && Array.isArray(s.placed) && s.hand.every(k => BY_KEY[k] && s.piles[k] === undefined)) return s;
    }
  } catch (e) { /* storage unavailable */ }
  return null;
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
function guessLang() {
  const n = (navigator.language || "en").slice(0, 2).toLowerCase();
  return L[n] ? n : "en";
}
const saved = load();
let S = saved || fresh(guessLang());
if (S.step !== "intro") S.step = "intro";           // always land on the intro, offer to resume
let sel = null, landed = null, dealAnim = false;
let sheetKey = null, promptSheet = false, sheetToast = { text: "", bad: false }, confirmRestart = false, copyMode = "both", toast = { text: "", bad: false };

const t = () => L[S.lang];
const sortedCount = () => Object.keys(S.piles).length;
const inPile = p => S.order.filter(k => S.piles[k] === p);
const undealt = () => S.order.filter(k => S.piles[k] === undefined && !S.hand.includes(k));
function topOf(p) {
  for (let i = S.placed.length - 1; i >= 0; i--) if (S.piles[S.placed[i]] === p) return S.placed[i];
  return inPile(p).pop() || null;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nm = k => BY_KEY[k][S.lang][0];
/* escaped name for markup; hyphenated compounds (SELF-ACCEPTANCE) stay on one line */
const nmH = k => esc(nm(k)).replace(/\S+-\S+/g, w => `<span class="nw">${w}</span>`);
const df = k => BY_KEY[k][S.lang][1];

/* ---------- scoring (Schwartz higher-order poles) ---------- */
function poleScores() {
  const scored = CARDS.filter(c => SCORE[S.piles[c.key]] !== undefined);
  const mean = scored.length ? scored.reduce((a, c) => a + SCORE[S.piles[c.key]], 0) / scored.length : 0;
  const P = Object.fromEntries(POLES.map(p => [p, { w: 0, s: 0, n: 0, top: [] }]));
  for (const c of scored) {
    if (!c.ho) continue;
    const parts = c.ho.split("/");
    const w = (c.conf === "low" ? 0.5 : 1) / parts.length;
    const score = SCORE[S.piles[c.key]];
    for (const p of parts) {
      P[p].w += w; P[p].s += w * score; P[p].n += 1;
      if (S.piles[c.key] === TOP) P[p].top.push(c.key);
    }
  }
  const out = {};
  for (const p of POLES) out[p] = { index: P[p].w ? P[p].s / P[p].w - mean : 0, n: P[p].n, top: P[p].top };
  return { mean, poles: out };
}
function num(x, signed) {
  let s = Math.abs(x).toFixed(2);
  if (S.lang !== "en") s = s.replace(".", ",");
  if (!signed) return s;
  return (x >= 0.005 ? "+" : x <= -0.005 ? "−" : "") + s;
}

/* ---------- texts to copy ---------- */
function cardLine(k) {
  const c = BY_KEY[k];
  const en = S.lang === "en" ? "" : ` (${c.en[0]})`;
  return `${c[S.lang][0]}${en} — ${c[S.lang][1]}`;
}
function dataBlock() {
  const T = t(), D = T.d, { mean, poles } = poleScores();
  const lines = [D.head, D.method, `${D.date}: ${S.date}`, "", D.piles];
  for (const p of PILES) {
    const ks = inPile(p);
    lines.push("", `[${T.piles[p]} — ${ks.length}]`);
    ks.forEach(k => lines.push(`- ${cardLine(k)}`));
  }
  lines.push("", D.poles, D.polesMethod(T.piles, num(mean), inPile(UNSURE).length));
  for (const p of POLES) lines.push(`- ${T.poles[p]}: ${num(poles[p].index, true)} (${D.cards}: ${poles[p].n})`);
  lines.push(D.axes, "", D.polesTop(T.piles));
  for (const p of POLES) lines.push(`- ${T.poles[p]}: ${poles[p].top.length ? poles[p].top.map(nm).join(", ") : "—"}`);
  return lines.join("\n");
}
function plainSort() {
  const T = t(), D = T.d;
  const lines = [D.plain(S.date)];
  for (const p of PILES) { const ks = inPile(p); lines.push("", `${T.piles[p]} (${ks.length}): ${ks.map(nm).join(", ")}`); }
  return lines.join("\n");
}
function promptWith(data) { return PROMPTS[S.lang].replace("{{LAYOUT}}", data); }
function copyText(mode) {
  if (mode === "cards") return plainSort();
  if (mode === "prompt") return promptWith(t().d.placeholder);
  return promptWith(dataBlock());
}

function confirmBox() {
  const T = t();
  return `<div class="confirm" style="margin-top:14px"><span>${esc(T.restartQ)}</span>
    <button class="btn" type="button" data-act="restart">${esc(T.yesRestart)}</button>
    <button class="btn quiet" type="button" data-act="cancel-restart">${esc(T.cancel)}</button></div>`;
}
const lvl = p => `<span class="lvl" aria-hidden="true">${p === UNSURE ? "<b>?</b>" : [1, 2, 3].map(n => `<i class="${n <= LEVEL[p] ? "f" : ""}"></i>`).join("")}</span>`;
function pileOrder(p) {                     // bottom to top: the last card placed lies on top
  const ks = S.placed.filter(k => S.piles[k] === p);
  return inPile(p).filter(k => !ks.includes(k)).concat(ks);
}
function vSort() {
  const T = t(), n = sortedCount(), round = Math.max(1, Math.ceil((CARDS.length - undealt().length) / HAND));
  if (sel && !S.hand.includes(sel)) sel = null;
  const cols = BOARD.map((p, i) => {
    const ks = pileOrder(p), top = ks.pop();
    return `<div class="col" data-act="deck" data-v="${p}" data-drop="${p}" ${pileVar(p)} aria-label="${esc(T.piles[p])}: ${ks.length + (top ? 1 : 0)}">
      <div class="col-h">${lvl(p)}<span class="t">${esc(T.piles[p])}</span><span class="n">${ks.length + (top ? 1 : 0)}</span><kbd>${i + 1}</kbd></div>
      <div class="cascade">
        ${ks.map(k => `<button class="strip" type="button" data-act="open" data-v="${k}" title="${esc(nm(k))} — ${esc(df(k))}">${esc(nm(k))}</button>`).join("")}
        ${top ? `<div class="top-card${landed === p ? " land" : ""}" role="button" tabindex="0" data-act="open" data-v="${top}" data-drag="pile" data-k="${top}">
          <span class="name">${nmH(top)}</span><span class="def">${esc(df(top))}</span></div>` : `<div class="hint">${lvl(p)}</div>`}
      </div>
    </div>`;
  }).join("");
  const hand = S.hand.map((k, i) => `<button class="hcard${dealAnim ? " deal" : ""}" type="button" data-act="pick" data-v="${k}" data-drag="hand" data-k="${k}" aria-pressed="${sel === k}" title="${esc(df(k))}" style="--r:${ROT[i % ROT.length]}deg;--i:${i}">
      <span class="no">№ ${BY_KEY[k].id}</span><span class="name">${nmH(k)}</span><span class="def">${esc(df(k))}</span>
    </button>`).join("");
  const done = n === CARDS.length;
  return `<div class="stack" style="gap:14px">
    <div class="progress"><div class="meta"><span>${esc(T.progress(n))} · ${esc(T.round(Math.min(round, ROUNDS)))}</span>
      <button class="btn quiet" type="button" data-act="undo" style="padding:0 4px;white-space:nowrap" ${S.hist.length ? "" : "disabled"}>${esc(T.back)}</button></div>
      <div class="track"><i style="width:${n}%"></i></div></div>
    <section aria-label="${esc(T.hand)}">
      <div class="hand" data-drop="hand">${hand || (done ? `<div class="done"><span>${esc(T.allPlaced)}</span>
        <button class="btn primary" type="button" data-act="go" data-v="review">${esc(T.toReview)}</button></div>` : "")}</div>
      ${hand ? `<p class="hand-info" aria-live="polite">${sel ? `<b>${nmH(sel)}</b> — ${esc(df(sel))}` : esc(T.tapHint)}</p>` : ""}
    </section>
    <div class="board" role="group" aria-label="${esc(T.nav[0])}">${cols}</div>
    <p class="small">${esc(T.sortHint)}</p>
  </div>`;
}
function topStatus() {
  const T = t();
  return `<span class="status ok">${esc(T.topCount(inPile(TOP).length))}</span>`;
}
function vReview() {
  const T = t();
  const piles = PILES.map(p => {
    const ks = inPile(p);
    return `<section class="pile" data-pile="${p}" ${pileVar(p)}>
      <div class="pile-h"><span class="sw"></span><b>${esc(T.piles[p])}</b><span class="n">${ks.length}</span></div>
      <div class="chips">${ks.length ? ks.map(k => `<button class="chip" type="button" draggable="true" data-act="open" data-v="${k}" title="${esc(df(k))}" ${pileVar(p)}>${nmH(k)}</button>`).join("") : `<span class="empty">${esc(T.emptyPile)}</span>`}</div>
    </section>`;
  }).join("");
  return `<div class="stack" style="gap:18px">
    <div><h2>${esc(T.reviewTitle)}</h2><p class="small" style="font-size:15px;max-width:62ch">${esc(T.reviewText)}</p></div>
    <div class="piles">${piles}</div>
    <div class="sticky-foot">${topStatus()}
      <button class="btn primary" type="button" data-act="go" data-v="result">${esc(T.toResult)}</button></div>
  </div>`;
}
function vResult() {
  const T = t(), top = inPile(TOP), { poles } = poleScores();
  const dist = PILES.map(p => [p, inPile(p).length]);
  const MAXI = 1;
  const poleRow = p => {
    const v = poles[p].index, w = Math.min(Math.abs(v), MAXI) / MAXI * 50;
    const pos = v >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`;
    return `<div class="pole"><span>${esc(T.poles[p])}</span><span class="b"><i class="${v < 0 ? "neg" : ""}" style="${pos}"></i></span><span class="v">${num(v, true)}</span></div>`;
  };
  const cbtn = (mode, title, sub, primary) =>
    `<button class="copy-btn${primary ? " primary" : ""}" type="button" data-act="copy" data-v="${mode}" aria-pressed="${copyMode === mode}"><b>${esc(title)}</b><span>${esc(sub)}</span></button>`;
  return `<div class="stack">
    <div><p class="eyebrow">${esc(S.date)}</p><h2>${esc(T.resultTitle)}</h2></div>
    <section class="panel"><h3>${esc(T.copyTitle)}</h3>
      <p style="margin-bottom:14px;max-width:62ch">${esc(T.copyText)} <a href="https://claude.ai/new" target="_blank" rel="noopener">${esc(T.openClaude)}</a></p>
      <div class="copy-grid">
        ${cbtn("both", T.copyBoth, T.copyBothSub, true)}
        ${cbtn("cards", T.copyCards, T.copyCardsSub)}
        ${cbtn("prompt", T.copyPrompt, T.copyPromptSub)}
      </div>
      <p class="toast${toast.bad ? " bad" : ""}" role="status">${esc(toast.text)}</p>
      <label class="small" for="out">${esc(T.preview)}</label>
      <textarea id="out" readonly>${esc(copyText(copyMode))}</textarea>
      <p class="note" style="margin-top:12px">${esc(T.privacy)}</p>
    </section>
    <div class="intro-grid">
      <section class="panel"><h3>${esc(T.piles[TOP])} · ${top.length}</h3>
        <ul class="toplist plain">${top.length ? top.map(k => `<li><span><b>${nmH(k)}</b><br><span>${esc(df(k))}</span></span></li>`).join("") : `<li><span class="empty">${esc(T.emptyPile)}</span></li>`}</ul>
      </section>
      <div class="stack" style="gap:20px">
        <section class="panel"><h3>${esc(T.distTitle)}</h3>
          <div class="dist">${dist.filter(([, n]) => n).map(([p, n]) => `<i style="--pc: var(${PC[p]});flex:${n}" title="${esc(T.piles[p])}: ${n}"></i>`).join("")}</div>
          <div class="legend">${dist.map(([p, n]) => `<span><i class="sw" ${pileVar(p)}></i>${esc(T.piles[p])} · ${n}</span>`).join("")}</div>
        </section>
        <section class="panel"><h3>${esc(T.polesTitle)}</h3>
          <div class="poles">${POLES.map(poleRow).join("")}</div>
          <p class="small" style="margin-top:12px">${esc(T.polesNote)}</p>
        </section>
      </div>
    </div>
    <div class="row">
      <button class="btn" type="button" data-act="go" data-v="review">${esc(T.editPiles)}</button>
      <button class="btn quiet" type="button" data-act="ask-restart">${esc(T.restart)}</button>
    </div>
    ${confirmRestart ? confirmBox() : ""}
  </div>`;
}
function renderSheet() {
  const root = document.getElementById("sheet-root");
  if (promptSheet) {
    const T = t();
    root.innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="pr-t">
      <h2 id="pr-t" style="margin:0">${esc(T.promptTitle)}</h2>
      <p class="small" style="font-size:15px">${esc(T.promptText)}</p>
      <div class="row"><button class="btn primary" type="button" data-act="copy-prompt-sheet">${esc(T.copyPromptBtn)}</button>
        <a href="https://claude.ai/new" target="_blank" rel="noopener">${esc(T.openClaude)}</a></div>
      <p class="toast${sheetToast.bad ? " bad" : ""}" role="status">${esc(sheetToast.text)}</p>
      <textarea id="prompt-out" readonly aria-label="${esc(T.promptTitle)}">${esc(copyText("prompt"))}</textarea>
      <button class="btn" type="button" data-act="close-sheet">${esc(T.close)}</button>
    </div></div>`;
    root.querySelector("[data-act=copy-prompt-sheet]").focus();
    return;
  }
  if (!sheetKey) { root.innerHTML = ""; return; }
  const T = t(), cur = S.piles[sheetKey];
  root.innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-n">
    <div class="name" id="sh-n">${nmH(sheetKey)}</div><div class="def">${esc(df(sheetKey))}</div>
    <h3 style="margin:4px 0 0">${esc(T.moveTo)}</h3>
    <div class="move">${PILES.map(p => `<button type="button" data-act="move" data-v="${p}" ${pileVar(p)} aria-current="${p === cur}"><i class="sw"></i>${esc(T.piles[p])}${p === cur ? `<span class="cur">${esc(T.current)}</span>` : ""}</button>`).join("")}</div>
    ${S.step === "sort" && cur !== undefined ? `<button class="btn" type="button" data-act="to-hand">${esc(T.toHand)}</button>` : ""}
    <button class="btn" type="button" data-act="close-sheet">${esc(T.close)}</button>
  </div></div>`;
  root.querySelector(`.move button[aria-current="true"]`)?.focus();
  fitNames();
}
/* card titles never break inside a word: shrink the font until the longest word fits on one line */
/* measure the text boxes: scrollWidth misses text spilling into the element's padding;
   widths, not edges, so a tilted or animating card (the game board) measures the same as a still one */
function overflows(el) {
  const range = document.createRange(); range.selectNodeContents(el);
  const cs = getComputedStyle(el), box = el.getBoundingClientRect();
  if (cs.writingMode.startsWith("vertical")) {                   // phone hand: lines run vertically
    const scale = box.height / (el.offsetHeight || 1), room = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    return [...range.getClientRects()].some(r => r.height / scale > room + 0.5);
  }
  const scale = box.width / (el.offsetWidth || 1), room = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  return [...range.getClientRects()].some(r => r.width / scale > room + 0.5);
}
function fitNames() {
  document.querySelectorAll(".card .name, .sheet .name").forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (overflows(el) && size > 12) { size -= 1; el.style.fontSize = size + "px"; }
  });
  /* the small cards of the game board (hand, deck tops) go down in half pixels */
  document.querySelectorAll(".hcard .name, .top-card .name").forEach(el => {
    el.style.fontSize = ""; el.classList.remove("clip");
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (overflows(el) && size > 8) { size -= 0.5; el.style.fontSize = size + "px"; }
    if (overflows(el)) el.classList.add("clip");                  // narrow phones: the full title shows below the hand
  });
  layoutPiles();
}
/* buried cards share whatever height the column has left under its top card */
function layoutPiles() {
  document.querySelectorAll(".cascade").forEach(c => {
    const n = c.querySelectorAll(".strip").length, top = c.querySelector(".top-card");
    if (!n) return;
    c.style.setProperty("--strip", "26px");
    const free = c.clientHeight - (top ? top.offsetHeight : 0);
    const h = Math.max(2, Math.min(26, free / n));
    c.style.setProperty("--strip", `${h}px`);
    c.classList.toggle("thin", h < 9);                              // too thin to read: a tap still opens the card
  });
}
function render() {
  if (S.step === "sort") deal();
  document.body.classList.toggle("wide", S.step === "sort");
  renderChrome();
  app.innerHTML = { intro: vIntro, sort: vSort, review: vReview, result: vResult }[S.step]();
  dealAnim = false; landed = null;
  renderSheet();
  fitNames();
  save();
}

/* ---------- actions ---------- */
function deal() {
  if (S.hand.length) return;
  S.hand = undealt().slice(0, HAND);
  if (S.hand.length) dealAnim = true;
}
/* moves card k to deck `to` or back to the "hand"; every move is undoable */
function moveCard(k, to) {
  const from = S.piles[k];
  if (to === "hand" ? from === undefined : from === to) return false;
  S.hist.push({ k, p: from === undefined ? null : from, h: S.hand.slice(), i: S.placed.indexOf(k) });
  if (S.hist.length > 300) S.hist.shift();
  S.placed = S.placed.filter(x => x !== k);
  if (to === "hand") { delete S.piles[k]; S.hand.push(k); }
  else { S.piles[k] = to; S.placed.push(k); S.hand = S.hand.filter(x => x !== k); landed = to; }
  if (sel === k) sel = null;
  deal();
  return true;
}
function play(k, to) {
  const fromHand = S.piles[k] === undefined;
  if (moveCard(k, to) && S.step === "sort" && fromHand && sortedCount() === CARDS.length) { go("review"); return; }
  render();
}
function undo() {
  const h = S.hist.pop();
  if (!h) return;
  if (h.p === null) delete S.piles[h.k]; else S.piles[h.k] = h.p;
  S.hand = h.h;
  S.placed = S.placed.filter(x => x !== h.k);
  if (h.i >= 0) S.placed.splice(h.i, 0, h.k);
  sel = null;
  render();
}
function go(step) {
  S.step = step; toast = { text: "", bad: false }; confirmRestart = false;
  render(); window.scrollTo(0, 0);
}
function resumeStep() {
  return sortedCount() < CARDS.length ? "sort" : "review";
}
/* the Clipboard API exists only on https and localhost; over plain http (a LAN address, a Docker host)
   fall back to the older copy command, which works there as long as it runs inside the click */
function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
async function writeClipboard(text) {
  if (!navigator.clipboard) return legacyCopy(text);
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { return legacyCopy(text); }
}
async function copy(mode) {
  copyMode = mode;
  const ok = await writeClipboard(copyText(mode));
  toast = ok ? { text: t().copied, bad: false } : { text: t().copyFail, bad: true };
  render();
  if (!ok) { const ta = document.getElementById("out"); ta.focus(); ta.select(); }
}

async function copyPromptSheet() {
  const ok = await writeClipboard(copyText("prompt"));
  sheetToast = ok ? { text: t().copied, bad: false } : { text: t().copyFail, bad: true };
  renderSheet();
  if (!ok) { const ta = document.getElementById("prompt-out"); ta.focus(); ta.select(); }
}

document.addEventListener("click", e => {
  if (Date.now() < noClickUntil) return;                         // the click that follows a drag or a handled tap
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "close-sheet" && el.classList.contains("scrim") && e.target !== el) return;
  act(el);
});
function act(el) {
  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case "lang": S.lang = v; render(); break;
    case "home": S.step = "intro"; confirmRestart = false; render(); break;
    case "start": S.step = "sort"; render(); break;
    case "resume": go(resumeStep()); break;
    case "ask-restart": confirmRestart = true; render(); break;
    case "cancel-restart": confirmRestart = false; render(); break;
    case "restart": { const lang = S.lang; S = fresh(lang); S.step = "sort"; sel = null; confirmRestart = false; copyMode = "both"; render(); break; }
    case "pick": sel = sel === v ? null : v; render(); break;
    case "deck": if (sel) play(sel, Number(v)); break;
    case "undo": undo(); break;
    case "open": {
      const col = el.closest(".col");                            // with a card selected, any tap on a column plays it there
      if (sel && col) play(sel, Number(col.dataset.v)); else { sheetKey = v; renderSheet(); }
      break;
    }
    case "close-sheet": sheetKey = null; promptSheet = false; sheetToast = { text: "", bad: false }; renderSheet(); break;
    case "show-prompt": sheetKey = null; promptSheet = true; renderSheet(); break;
    case "copy-prompt-sheet": copyPromptSheet(); break;
    case "move": { const k = sheetKey; sheetKey = null; play(k, Number(v)); break; }
    case "to-hand": { const k = sheetKey; sheetKey = null; play(k, "hand"); break; }
    case "nav":
      if (v === "sort" && sortedCount() === CARDS.length) S.hist = [];
      go(v); break;
    case "go": go(v); break;
    case "copy": copy(v); break;
  }
}
document.addEventListener("keydown", e => {
  const open = sheetKey || promptSheet;
  if (open && e.key === "Escape") { sheetKey = null; promptSheet = false; renderSheet(); return; }
  if (!open && e.key === "Enter" && e.target.matches?.(".top-card")) { e.preventDefault(); act(e.target); return; }
  if (open || S.step !== "sort" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = sel || S.hand[0];
  if (/^[1-4]$/.test(e.key)) { e.preventDefault(); if (k) play(k, BOARD[Number(e.key) - 1]); }
  else if (e.key === "Backspace") { e.preventDefault(); undo(); }
  else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && S.hand.length) {
    e.preventDefault();
    const i = sel ? S.hand.indexOf(sel) : -1, d = e.key === "ArrowRight" ? 1 : -1;
    sel = S.hand[(i + d + S.hand.length) % S.hand.length]; render();
  }
});

/* sort board: pointer drag (mouse, pen, touch) from the hand or a deck's top card onto a deck or back to the hand */
let drag = null, noClickUntil = 0;
document.addEventListener("pointerdown", e => {
  if (S.step !== "sort" || drag || (e.pointerType === "mouse" && e.button !== 0)) return;
  noClickUntil = 0;
  const src = e.target.closest("[data-drag]");
  if (src) drag = { src, k: src.dataset.k, id: e.pointerId, x: e.clientX, y: e.clientY, ghost: null, over: null };
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.ghost) {
    if (Math.hypot(dx, dy) < 6) return;
    const r = drag.src.getBoundingClientRect(), g = drag.src.cloneNode(true);
    g.classList.remove("deal"); g.classList.add("ghost");
    g.style.setProperty("--pc", getComputedStyle(drag.src).getPropertyValue("--pc"));
    Object.assign(g.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px` });
    document.body.appendChild(g);
    drag.src.classList.add("lifted");
    drag.ghost = g;
  }
  e.preventDefault();
  drag.ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(3deg) scale(1.04)`;
  const over = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-drop]") || null;
  if (over !== drag.over) { drag.over?.classList.remove("over"); over?.classList.add("over"); drag.over = over; }
  if (e.clientY < 56) window.scrollBy(0, -12); else if (e.clientY > innerHeight - 56) window.scrollBy(0, 12);
});
function endDrag(e, drop) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  noClickUntil = Date.now() + 600;                               // browsers may or may not send a click after this
  if (!d.ghost) {                                                // a plain tap on a card: select it, or tap the deck it sits on
    const el = drop && d.src.isConnected ? d.src.closest("[data-act]") : null;
    if (el) act(el);
    return;
  }
  d.over?.classList.remove("over");
  const to = drop && d.over ? d.over.dataset.drop : null;
  const dest = to === null ? null : to === "hand" ? "hand" : Number(to);
  const moves = dest !== null && (dest === "hand" ? S.piles[d.k] !== undefined : S.piles[d.k] !== dest);
  if (moves) { d.ghost.remove(); play(d.k, dest); return; }
  d.ghost.style.transition = "transform .18s ease-out";          // no target: fly back
  d.ghost.style.transform = "none";
  setTimeout(() => { d.ghost.remove(); d.src.classList.remove("lifted"); }, 190);
}
document.addEventListener("pointerup", e => endDrag(e, true));
document.addEventListener("pointercancel", e => endDrag(e, false));
/* desktop drag-and-drop between piles; touch users move cards with the sheet */
document.addEventListener("dragstart", e => { const c = e.target.closest(".chip"); if (c) e.dataTransfer.setData("text/plain", c.dataset.v); });
document.addEventListener("dragover", e => { const p = e.target.closest(".pile"); if (p) { e.preventDefault(); p.classList.add("drop"); } });
document.addEventListener("dragleave", e => { const p = e.target.closest(".pile"); if (p && !p.contains(e.relatedTarget)) p.classList.remove("drop"); });
document.addEventListener("drop", e => {
  const p = e.target.closest(".pile"); if (!p) return;
  e.preventDefault();
  const k = e.dataTransfer.getData("text/plain");
  if (BY_KEY[k]) play(k, Number(p.dataset.pile));
});

render();
window.addEventListener("resize", fitNames);
document.fonts?.ready.then(fitNames);
</script>
