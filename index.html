<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PsychoMirror</title>
<meta name="description" content="Personal Values Card Sort: sort 100 value cards and copy the result with an analysis prompt for your AI chat. EN / RU / HU.">
<style>
/* Layout: one centred column under a sticky bar; while sorting, the index card is the hero and the five piles sit under it as an ordinal scale. */
:root {
  --bg: #ECEFF2;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --ink: #17202A;
  --muted: #586474;
  --line: #D2D9E1;
  --accent: #1C6A59;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEDE8;
  --warn: #8F5600;
  --warn-soft: #F6E8D2;
  --p0: #A3ADB8; --p1: #93BDB0; --p2: #5DA08D; --p3: #2F8069; --p4: #165A4A; --pu: #C2974B;
  --shadow: 0 1px 2px rgba(23, 32, 42, .06), 0 8px 28px rgba(23, 32, 42, .08);
  --serif: Georgia, "PT Serif", "Noto Serif", "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151A; --surface: #182029; --surface-2: #1D2630; --ink: #E4E9EF; --muted: #97A3B2; --line: #2B3540;
    --accent: #5DC3A6; --accent-ink: #0B1915; --accent-soft: #1C3530; --warn: #E3AA52; --warn-soft: #3A2D18;
    --p0: #4A5563; --p1: #3C6A5E; --p2: #3E8D77; --p3: #4FB195; --p4: #86DCC3; --pu: #CFA65E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151A; --surface: #182029; --surface-2: #1D2630; --ink: #E4E9EF; --muted: #97A3B2; --line: #2B3540;
  --accent: #5DC3A6; --accent-ink: #0B1915; --accent-soft: #1C3530; --warn: #E3AA52; --warn-soft: #3A2D18;
  --p0: #4A5563; --p1: #3C6A5E; --p2: #3E8D77; --p3: #4FB195; --p4: #86DCC3; --pu: #CFA65E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; margin-right: auto; background: none; border: 0; padding: 4px 0; cursor: pointer; }
.brand span { color: var(--accent); }
.steps { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--muted); }
.steps li { padding: 3px 8px; border-radius: 999px; }
.steps li.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.steps li.done { color: var(--ink); }
main a, .sheet a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
.prompt-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
.prompt-btn:hover { border-color: var(--muted); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.lang button { border: 0; background: none; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .06em; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(32px, 6vw, 46px); line-height: 1.1; margin: 0 0 14px; text-wrap: balance; }
h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(24px, 4.4vw, 30px); line-height: 1.2; margin: 0 0 8px; text-wrap: balance; }
h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 700; }
.lede { font-size: 18px; color: var(--muted); max-width: 60ch; margin: 0 0 28px; }
p { margin: 0; }
.stack { display: grid; gap: 28px; }
.small { font-size: 13px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 12px 20px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { background: none; border-color: transparent; color: var(--muted); padding-inline: 10px; }
.btn.quiet:hover { color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* index card */
.card {
  position: relative; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 28px 28px 30px; border-top: 4px solid var(--accent); min-height: 220px; display: flex; flex-direction: column; gap: 14px;
}
.card .no { position: absolute; top: 14px; right: 18px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.card .name { font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); padding-right: 48px; }
.card .def { font-family: var(--serif); font-size: clamp(24px, 5vw, 32px); line-height: 1.25; text-wrap: balance; }
.card.example { min-height: 0; max-width: 420px; }
.card.example .def { font-size: 22px; }
.card.enter { animation: enter .22s ease-out; }
@keyframes enter { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }

.intro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.intro-grid > * { min-width: 0; }
ol.how { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
ol.how li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
ol.how li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--ink); font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.note { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; color: var(--muted); font-size: 14px; max-width: 62ch; }

/* sorting */
.progress { display: grid; gap: 8px; }
.progress .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .2s; }
.scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pile-btn {
  display: grid; gap: 8px; align-content: start; text-align: left; padding: 12px; border-radius: 12px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); min-height: 92px; transition: transform .08s, border-color .1s;
}
.pile-btn:hover { border-color: var(--pc); }
.pile-btn:active { transform: translateY(1px); }
.pile-btn .lvl { display: flex; gap: 3px; align-items: center; min-height: 12px; }
.pile-btn .lvl b { font-size: 14px; line-height: 1; color: var(--pc); }
.pile-btn .lvl i { width: 10px; height: 4px; border-radius: 2px; background: var(--line); }
.pile-btn .lvl i.f { background: var(--pc); }
.pile-btn .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.pile-btn .k { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pile-btn .k kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }

/* review */
.piles { display: grid; gap: 14px; }
.pile { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); padding: 14px 16px 16px; }
.pile.drop { border-color: var(--accent); background: var(--accent-soft); }
.pile-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--pc); flex: none; }
.pile-h b { font-size: 15px; }
.pile-h .n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 9px; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; cursor: pointer; }
.chip:hover { border-color: var(--pc); }
.chip[draggable="true"] { cursor: grab; }
.empty { font-size: 13px; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.status.ok { background: var(--accent-soft); }
.status.bad { background: var(--warn-soft); color: var(--warn); }
.sticky-foot {
  position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between;
}

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 18, .45); z-index: 40; display: grid; place-items: end center; padding: 16px; }
@media (min-width: 640px) { .scrim { place-items: center; } }
.sheet { width: min(520px, 100%); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 14px; max-height: 90vh; overflow: auto; }
.sheet.wide { width: min(760px, 100%); }
.sheet .name { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.sheet .def { font-family: var(--serif); font-size: 22px; line-height: 1.3; }
.move { display: grid; gap: 6px; }
.move button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.move button:hover { border-color: var(--pc); }
.move button[aria-current="true"] { background: var(--surface-2); font-weight: 600; }
.move button .cur { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }

/* rank */
ol.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ol.rank li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 12px 14px; }
ol.rank .num { font-family: var(--serif); font-size: 26px; color: var(--accent); font-variant-numeric: tabular-nums; text-align: center; }
ol.rank .txt { min-width: 0; }
ol.rank .txt b { display: block; font-size: 13px; letter-spacing: .1em; }
ol.rank .txt span { font-size: 14px; color: var(--muted); }
.arrows { display: flex; gap: 4px; }
.arrows button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 16px; line-height: 1; }
.arrows button:disabled { opacity: .3; cursor: default; }

/* result */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.toplist { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.toplist li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: baseline; }
.toplist .num { font-family: var(--serif); color: var(--accent); font-size: 18px; text-align: right; font-variant-numeric: tabular-nums; }
.toplist b { font-size: 13px; letter-spacing: .08em; }
.toplist span { color: var(--muted); font-size: 14px; }
.dist { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; margin-bottom: 10px; }
.dist i { background: var(--pc); min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.poles { display: grid; gap: 12px; }
.pole { display: grid; grid-template-columns: minmax(0, 11rem) 1fr 3.5rem; gap: 12px; align-items: center; font-size: 14px; }
.pole .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.pole .b { position: relative; height: 10px; background: var(--surface-2); border-radius: 999px; }
.pole .b::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.pole .b i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; }
.pole .b i.neg { background: var(--p0); }
.copy-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.copy-btn { text-align: left; display: grid; gap: 4px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.copy-btn:hover { border-color: var(--muted); }
.copy-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.copy-btn b { font-size: 15px; }
.copy-btn span { font-size: 13px; opacity: .8; }
.copy-btn[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent) inset; }
.copy-btn.primary[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink) inset; }
.toast { min-height: 1.5em; font-size: 14px; font-weight: 600; color: var(--accent); }
.toast.bad { color: var(--warn); }
textarea { width: 100%; min-height: 260px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface-2); color: var(--ink); font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.confirm { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--warn-soft); padding: 10px 14px; border-radius: 12px; }
footer { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; font-size: 12px; color: var(--muted); }

@media (max-width: 640px) {
  .intro-grid { grid-template-columns: 1fr; }
  .steps { display: none; }
  .scale { grid-template-columns: 1fr; }
  .scale .pile-btn { min-height: 0; grid-template-columns: auto 1fr auto; align-items: center; padding: 12px 14px; }
  .scale { display: flex; flex-direction: column; }
  .counts { display: none; }
  .copy-grid { grid-template-columns: 1fr; }
  .pole { grid-template-columns: 1fr 3.5rem; }
  .pole .b { grid-column: 1 / -1; grid-row: 2; }
  .card { padding: 24px 20px 24px; min-height: 200px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

 и выполнять их"],"hu":["FELELŐSSÉG","felelős döntéseket hozni és végrehajtani"]},{"id":83,"key":"RISK","ho":"OPENNESS","conf":"high","en":["RISK","to take risks and chances"],"ru":["РИСК","рисковать и испытывать удачу"],"hu":["KOCKÁZAT","kockázatot vállalni, és élni a lehetőségekkel"]},{"id":84,"key":"ROMANCE","ho":null,"conf":"low","en":["ROMANCE","to have intense, exciting love in my life"],"ru":["РОМАНТИКА","переживать сильную, яркую любовь"],"hu":["ROMANTIKA","intenzív, izgalmas szerelmet megélni"]},{"id":85,"key":"SAFETY","ho":"CONSERVATION","conf":"high","en":["SAFETY","to be safe and secure"],"ru":["БЕЗОПАСНОСТЬ","жить в безопасности и защищённости"],"hu":["BIZTONSÁG","biztonságban és védettségben élni"]},{"id":86,"key":"SELF_ACCEPTANCE","ho":null,"conf":"low","en":["SELF-ACCEPTANCE","to accept myself as I am"],"ru":["САМОПРИНЯТИЕ","принимать себя целиком, со всеми особенностями"],"hu":["ÖNELFOGADÁS","elfogadni magam olyannak, amilyen vagyok"]},{"id":87,"key":"SELF_CONTROL","ho":"CONSERVATION","conf":"medium","en":["SELF-CONTROL","to be disciplined in my own actions"],"ru":["САМОКОНТРОЛЬ","дисциплинированно управлять своими поступками"],"hu":["ÖNFEGYELEM","fegyelmezetten irányítani a tetteimet"]},{"id":88,"key":"SELF_ESTEEM","ho":null,"conf":"low","en":["SELF-ESTEEM","to feel good about myself"],"ru":["САМОУВАЖЕНИЕ","хорошо относиться к себе"],"hu":["ÖNBECSÜLÉS","elégedettnek lenni önmagammal"]},{"id":89,"key":"SELF_KNOWLEDGE","ho":"OPENNESS","conf":"low","en":["SELF-KNOWLEDGE","to have a deep and honest understanding of myself"],"ru":["САМОПОЗНАНИЕ","глубоко и честно понимать себя"],"hu":["ÖNISMERET","mélyen és őszintén ismerni önmagam"]},{"id":90,"key":"SERVICE","ho":"SELF_TRANSCENDENCE","conf":"high","en":["SERVICE","to be helpful and of service to others"],"ru":["СЛУЖЕНИЕ","помогать другим и приносить им пользу"],"hu":["SZOLGÁLAT","segítőkésznek lenni, és mások szolgálatára állni"]},{"id":91,"key":"SEXUALITY","ho":"OPENNESS/SELF_ENHANCEMENT","conf":"medi H","ho":"SELF_ENHANCEMENT","conf":"high","en":["WEALTH","to have plenty of money"],"ru":["БОГАТСТВО","иметь много денег"],"hu":["GAZDAGSÁG","sok pénzzel rendelkezni"]},{"id":100,"key":"WORLD_PEACE","ho":"SELF_TRANSCENDENCE","conf":"high","en":["WORLD PEACE","to work to promote peace in the world"],"ru":["МИР НА ЗЕМЛЕ","способствовать миру во всём мире"],"hu":["VILÁGBÉKE","tenni a világbéke előmozdításáért"]}];
const PROMPTS = {"en":"# Task: Psychological Analysis of a Values Profile\n\nBased on the provided distribution of values across 4 decks, compile a professional psychological analysis of the personality profile.\n\n## Source Data\n\nThe respondent distributed 100 values (Personal Values Card Sort, W. R. Miller et al., 2011) into 4 decks by importance: \"Very important\", \"Important\", \"Unsure\", \"Not important\". The cards in the \"Very important\" deck are also ranked: 1 is the most important. Each value has a short definition, and the respondent sorted by that definition.\n\nThe full sorting data is at the end of this message: the ranked top values, all four decks with definitions, and index scores for the four poles of the Schwartz model, calculated by software (the method is described in the data).\n\n## Analysis Requirements\n\nConduct a comprehensive psychological analysis covering the following aspects:\n\n### 1. Values Structure\n- Dominant value orientations\n- Hierarchy of priorities\n- Identified value clusters (social, personal, material, etc.)\n\n### 2. Personality Profile\n- Key personality traits manifested through value choices\n- Motivational structure\n- Characteristics of self-perception and identity\n\n### 3. Behavioral Patterns and Attitudes\n- Expected behavioral strategies\n- Attitude toward social interactions\n- Balance between individual and collective\n\n### 4. Areas of Conflict and Tension\n- Potential internal contradictions between values\n- Areas of possible life difficulties\n- Adaptation challenges\n\n### 5. Resources and Strengths\n- Constructive aspects of the profile\n- Development potential\n- Personality protective factors\n\n### 6. Socialization Context (optional)\n- Possible cultural and social influences on values formation\n- Signs of certain life stages or contexts\n- **Important**: analysis without direct categorization by gender/age, only description of sociocultural patterns\n\n### 7. Professional Fulfilment\n- Professional fields and roles in which the respondent's values are most likely to find expression: 5–8 specific examples, each with a rationale\n- Work environment, work format and management style in which the respondent is likely to be most effective\n- Environments and roles likely to cause inner resistance\n\n### 8. Relationships and Interaction\n- What is likely to matter most to the respondent in close relationships, friendship and teams\n- Possible sources of tension when interacting with people who hold different values\n\n### 9. Recommendations\n- Practical recommendations for development and for using strengths\n- Ways to work with the identified areas of tension\n- 3–5 questions for self-reflection\n\n## Response Format\n\nA structured psychological report in English using professional terminology. Start with a short profile summary (5–7 sentences). Length: 1500–2200 words.\n\nConclusions should be:\n- Justified through analysis of value choices, with reference to specific values\n- Balanced (strengths + development areas)\n- Ethical and non-stigmatizing\n- Based on recognized psychological theories (e.g., Schwartz's Theory of Basic Values, Self-Determination Theory, etc.)\n\n## Limitations\n\n- Avoid categorical statements\n- Use formulations like \"may indicate\", \"characteristic of\", \"likely\"\n- Do not make medical diagnoses\n- Maintain professional distance and objectivity\n\n## Sorting Data\n\n{{LAYOUT}}\n","ru":"# Задание: Психологический анализ профиля ценностей\n\nНа основе предоставленного распределения ценностей по 4 колодам составьте профессиональный психологический анализ личностного профиля.\n\n## Исходные данные\n\nРеспондент распределил 100 ценностей (методика Personal Values Card Sort, W. R. Miller и соавт., 2011) на 4 колоды по степени важности: «Очень важно», «Важно», «Сложно сказать», «Не важно». Карточки колоды «Очень важно» дополнительно ранжированы: 1 — самая важная. У каждой ценности есть короткое определение, и респондент ориентировался именно на него.\n\nПолные данные расклада приведены в конце сообщения: ранжированный топ, все четыре колоды с определениями и индексы четырёх полюсов модели Шварца, вычисленные программой (метод описан в данных).\n\n## Требования к анализу\n\nПроведите комплексный психологический анализ, включающий следующие аспекты:\n\n### 1. Структура ценностей\n- Доминирующие ценностные ориентации\n- Иерархия приоритетов\n- Выявленные кластеры ценностей (социальные, личностные, материальные и т.д.)\n\n### 2. Личностный профиль\n- Ключевые личностные черты, проявляющиеся через выбор ценностей\n- Мотивационная структура\n- Особенности самовосприятия и идентичности\n\n### 3. Паттерны поведения и установки\n- Предполагаемые поведенческие стратегии\n- Отношение к социальным взаимодействиям\n- Баланс между индивидуальным и коллективным\n\n### 4. Зоны конфликта и напряжения\n- Потенциальные внутренние противоречия между ценностями\n- Области возможных жизненных затруднений\n- Адаптационные вызовы\n\n### 5. Ресурсы и сильные стороны\n- Конструктивные аспекты профиля\n- Потенциал для развития\n- Защитные факторы личности\n\n### 6. Контекст социализации (опционально)\n- Возможные культурные и социальные влияния на формирование ценностей\n- Признаки определённых жизненных этапов или контекстов\n- **Важно**: анализ без прямой категоризации по полу/возрасту, только описание социокультурных паттернов\n\n### 7. Профессиональная реализация\n- Профессиональные сферы и роли, в которых ценности респондента вероятнее всего найдут реализацию: 5–8 конкретных примеров, каждый с обоснованием\n- Рабочая среда, формат работы и стиль руководства, в которых респондент, вероятно, будет наиболее эффективен\n- Среды и роли, которые, вероятно, будут вызывать внутреннее сопротивление\n\n### 8. Отношения и взаимодействие\n- Что, вероятно, особенно важно для респондента в близких отношениях, дружбе и команде\n- Возможные источники напряжения во взаимодействии с людьми с иными ценностями\n\n### 9. Рекомендации\n- Практические рекомендации по развитию и использованию сильных сторон\n- Способы работы с выявленными зонами напряжения\n- 3–5 вопросов для саморефлексии\n\n## Формат ответа\n\nСтруктурированный психологический отчёт на русском языке с использованием профессиональной терминологии. Начните с краткого резюме профиля (5–7 предложений). Объём: 1500–2200 слов.\n\nВыводы должны быть:\n- Обоснованными через анализ ценностных выборов, со ссылкой на конкретные ценности\n- Сбалансированными (сильные стороны + зоны развития)\n- Этичными и не стигматизирующими\n- Опирающимися на признанные психологические теории (например, теория ценностей Шварца, теория самодетерминации и др.)\n\n## Ограничения\n\n- Избегайте категоричных утверждений\n- Используйте формулировки \"может указывать на\", \"характерно для\", \"вероятно\"\n- Не делайте медицинских диагнозов\n- Сохраняйте профессиональную дистанцию и объективность\n\n## Данные расклада\n\n{{LAYOUT}}\n","hu":"# Feladat: Az értékprofil pszichológiai elemzése\n\nAz értékek 4 kupac szerinti megoszlása alapján készíts szakmai pszichológiai elemzést a személyiségprofilról.\n\n## Kiinduló adatok\n\nA válaszadó 100 értéket (Personal Values Card Sort, W. R. Miller és mtsai, 2011) osztott szét 4 kupacba fontosság szerint: „Nagyon fontos”, „Fontos”, „Bizonytalan”, „Nem fontos”. A „Nagyon fontos” kupac kártyái rangsorolva is vannak: az 1-es a legfontosabb. Minden értékhez rövid meghatározás tartozik, és a válaszadó ez alapján döntött.\n\nA válogatás teljes adatai az üzenet végén találhatók: a rangsorolt legfontosabb értékek, mind a négy kupac a meghatározásokkal, valamint a Schwartz-modell négy pólusának programmal számított indexei (a módszer leírása az adatok között szerepel).\n\n## Az elemzés követelményei\n\nKészíts átfogó pszichológiai elemzést a következő szempontok szerint:\n\n### 1. Az értékek szerkezete\n- Domináns értékorientációk\n- A prioritások hierarchiája\n- Azonosított értékcsoportok (társas, személyes, anyagi stb.)\n\n### 2. Személyiségprofil\n- Az értékválasztásokban megnyilvánuló fő személyiségvonások\n- Motivációs szerkezet\n- Az énkép és az identitás sajátosságai\n\n### 3. Viselkedési minták és attitűdök\n- Feltételezhető viselkedési stratégiák\n- Viszonyulás a társas interakciókhoz\n- Az egyéni és a közösségi egyensúlya\n\n### 4. Konfliktus- és feszültségzónák\n- Lehetséges belső ellentmondások az értékek között\n- Lehetséges élethelyzeti nehézségek területei\n- Alkalmazkodási kihívások\n\n### 5. Erőforrások és erősségek\n- A profil építő vonatkozásai\n- Fejlődési potenciál\n- A személyiség védőfaktorai\n\n### 6. Szocializációs háttér (opcionális)\n- Lehetséges kulturális és társadalmi hatások az értékek kialakulására\n- Bizonyos életszakaszokra vagy élethelyzetekre utaló jelek\n- **Fontos**: nem és életkor szerinti közvetlen besorolás nélkül, csak szociokulturális mintázatok leírása\n\n### 7. Szakmai kibontakozás\n- Szakterületek és szerepek, amelyekben a válaszadó értékei a legvalószínűbben érvényesülhetnek: 5–8 konkrét példa, mindegyik indoklással\n- Munkakörnyezet, munkaforma és vezetési stílus, amelyben a válaszadó valószínűleg a leghatékonyabb\n- Környezetek és szerepek, amelyek valószínűleg belső ellenállást váltanak ki\n\n### 8. Kapcsolatok és együttműködés\n- Mi lehet különösen fontos a válaszadónak a szoros kapcsolatokban, a barátságban és a csapatban\n- A feszültség lehetséges forrásai más értékeket valló emberekkel való kapcsolatban\n\n### 9. Ajánlások\n- Gyakorlati ajánlások a fejlődéshez és az erősségek kiaknázásához\n- Módszerek az azonosított feszültségzónák kezelésére\n- 3–5 kérdés az önreflexióhoz\n\n## A válasz formája\n\nStrukturált pszichológiai beszámoló magyarul, szakmai terminológiával. Kezdd a profil rövid összefoglalásával (5–7 mondat). Terjedelem: 1500–2200 szó.\n\nA következtetések legyenek:\n- Az értékválasztások elemzésével alátámasztottak, konkrét értékekre hivatkozva\n- Kiegyensúlyozottak (erősségek + fejlesztendő területek)\n- Etikusak és nem stigmatizálók\n- Elismert pszichológiai elméletekre épülők (például Schwartz alapérték-elmélete, az önmeghatározás-elmélet stb.)\n\n## Korlátozások\n\n- Kerüld a kategorikus állításokat\n- Használj olyan megfogalmazásokat, mint „utalhat arra”, „jellemző rá”, „valószínűleg”\n- Ne állíts fel orvosi diagnózist\n- Őrizd meg a szakmai távolságot és az objektivitást\n\n## A válogatás adatai\n\n{{LAYOUT}}\n"};

/* ---------- state ---------- */
function fresh(lang) {
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  return { v: 2, lang, step: "intro", seed, order: shuffled(CARDS.map(c => c.key), seed), idx: 0, piles: {}, hist: [], top: [], date: today() };
}
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function shuffled(arr, seed) {
  let a = seed >>> 0;
  const rnd = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if (s && s.v === 2 && Array.isArray(s.order) && s.order.length === CARDS.length && s.order.every(k => BY_KEY[k])) return s;
  } catch (e) { /* storage unavailable */ }
  return null;
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
function guessLang() {
  const n = (navigator.language || "en").slice(0, 2).toLowerCase();
  return L[n] ? n : "en";
}
const saved = load();
let S = saved || fresh(guessLang());
if (S.step !== "intro") S.step = "intro";           // always land on the intro, offer to resume
let sheetKey = null, promptSheet = false, sheetToast = { text: "", bad: false }, confirmRestart = false, copyMode = "both", toast = { text: "", bad: false };

const t = () => L[S.lang];
const sortedCount = () => Object.keys(S.piles).length;
const inPile = p => S.order.filter(k => S.piles[k] === p);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nm = k => BY_KEY[k][S.lang][0];
const df = k => BY_KEY[k][S.lang][1];

/* ---------- scoring (Schwartz higher-order poles) ---------- */
function poleScores() {
  const scored = CARDS.filter(c => SCORE[S.piles[c.key]] !== undefined);
  const mean = scored.length ? scored.reduce((a, c) => a + SCORE[S.piles[c.key]], 0) / scored.length : 0;
  const P = Object.fromEntries(POLES.map(p => [p, { w: 0, s: 0, n: 0, top: [] }]));
  for (const c of scored) {
    if (!c.ho) continue;
    const parts = c.ho.split("/");
    const w = (c.conf === "low" ? 0.5 : 1) / parts.length;
    const score = SCORE[S.piles[c.key]];
    for (const p of parts) {
      P[p].w += w; P[p].s += w * score; P[p].n += 1;
      if (S.piles[c.key] === TOP) P[p].top.push(c.key);
    }
  }
  const out = {};
  for (const p of POLES) out[p] = { index: P[p].w ? P[p].s / P[p].w - mean : 0, n: P[p].n, top: P[p].top };
  return { mean, poles: out };
}
function num(x, signed) {
  let s = Math.abs(x).toFixed(2);
  if (S.lang !== "en") s = s.replace(".", ",");
  if (!signed) return s;
  return (x >= 0.005 ? "+" : x <= -0.005 ? "−" : "") + s;
}

/* ---------- texts to copy ---------- */
function rankedTop() { return S.top.filter(k => S.piles[k] === TOP); }
function cardLine(k) {
  const c = BY_KEY[k];
  const en = S.lang === "en" ? "" : ` (${c.en[0]})`;
  return `${c[S.lang][0]}${en} — ${c[S.lang][1]}`;
}
function dataBlock() {
  const T = t(), D = T.d, { mean, poles } = poleScores();
  const lines = [D.head, D.method, `${D.date}: ${S.date}`, "", D.top];
  rankedTop().forEach((k, i) => lines.push(`${i + 1}. ${cardLine(k)}`));
  if (!rankedTop().length) lines.push("—");
  lines.push("", D.piles);
  for (const p of PILES) {
    const ks = inPile(p);
    lines.push("", `[${T.piles[p]} — ${ks.length}]`);
    ks.forEach(k => lines.push(`- ${cardLine(k)}`));
  }
  lines.push("", D.poles, D.polesMethod(T.piles, num(mean), inPile(UNSURE).length));
  for (const p of POLES) lines.push(`- ${T.poles[p]}: ${num(poles[p].index, true)} (${D.cards}: ${poles[p].n})`);
  lines.push(D.axes, "", D.polesTop(T.piles));
  for (const p of POLES) lines.push(`- ${T.poles[p]}: ${poles[p].top.length ? poles[p].top.map(nm).join(", ") : "—"}`);
  return lines.join("\n");
}
function plainSort() {
  const T = t(), D = T.d;
  const lines = [D.plain(S.date), "", D.plainTop];
  rankedTop().forEach((k, i) => lines.push(`${i + 1}. ${nm(k)}`));
  for (const p of PILES) { const ks = inPile(p); lines.push("", `${T.piles[p]} (${ks.length}): ${ks.map(nm).join(", ")}`); }
  return lines.join("\n");
}
function promptWith(data) { return PROMPTS[S.lang].replace("{{LAYOUT}}", data); }
function copyText(mode) {

}

/* ---------- actions ---------- */
function syncTop() {
  const inTop = new Set(inPile(TOP));
  S.top = S.top.filter(k => inTop.has(k));
  for (const k of S.order) if (inTop.has(k) && !S.top.includes(k)) S.top.push(k);
}
function put(p) {
  const k = S.order[S.idx];
  S.piles[k] = p; S.hist.push(k); S.idx += 1;
  if (S.idx >= S.order.length) { S.step = "review"; window.scrollTo(0, 0); }
  render();
}
function undo() {
  const k = S.hist.pop();
  if (!k) return;
  delete S.piles[k]; S.idx = S.order.indexOf(k);
  render();
}
function go(step) {
  if (step === "rank" || step === "result") syncTop();
  S.step = step; toast = { text: "", bad: false }; confirmRestart = false;
  render(); window.scrollTo(0, 0);
}
function resumeStep() {
  if (sortedCount() < CARDS.length) { S.idx = S.order.findIndex(k => S.piles[k] === undefined); return "sort"; }
  return S.top.length ? "result" : "review";
}
async function copy(mode) {
  copyMode = mode;
  const text = copyText(mode);
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
  toast = ok ? { text: t().copied, bad: false } : { text: t().copyFail, bad: true };
  render();
  if (!ok) { const ta = document.getElementById("out"); ta.focus(); ta.select(); }
}

async function copyPromptSheet() {
  let ok = false;
  try { await navigator.clipboard.writeText(copyText("prompt")); ok = true; } catch (e) { ok = false; }
  sheetToast = ok ? { text: t().copied, bad: false } : { text: t().copyFail, bad: true };
  renderSheet();
  if (!ok) { const ta = document.getElementById("prompt-out"); ta.focus(); ta.select(); }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === "close-sheet" && el.classList.contains("scrim") && e.target !== el) return;
  switch (a) {
    case "lang": S.lang = v; render(); break;
    case "home": S.step = "intro"; confirmRestart = false; render(); break;
    case "start": S.step = "sort"; render(); break;
    case "resume": go(resumeStep()); break;
    case "ask-restart": confirmRestart = true; render(); break;
    case "cancel-restart": confirmRestart = false; render(); break;
    case "restart": { const lang = S.lang; S = fresh(lang); S.step = "sort"; confirmRestart = false; copyMode = "both"; render(); break; }
    case "put": put(Number(v)); break;
    case "undo": undo(); break;
    case "open": sheetKey = v; renderSheet(); break;
    case "close-sheet": sheetKey = null; promptSheet = false; sheetToast = { text: "", bad: false }; renderSheet(); break;
    case "show-prompt": sheetKey = null; promptSheet = true; renderSheet(); break;
    case "copy-prompt-sheet": copyPromptSheet(); break;
    case "move": S.piles[sheetKey] = Number(v); sheetKey = null; syncTop(); render(); break;
    case "to-rank": go(inPile(TOP).length ? "rank" : "result"); break;
    case "go": go(v); break;
    case "mv": {
      const top = rankedTop(), i = Number(v), j = i + Number(el.dataset.d);
      if (j < 0 || j >= top.length) break;
      [top[i], top[j]] = [top[j], top[i]]; S.top = top; render();
      app.querySelectorAll(`[data-act="mv"][data-v="${j}"]`)[Number(el.dataset.d) < 0 ? 0 : 1]?.focus();
      break;
    }
    case "mv-top": {
      const top = rankedTop(), i = Number(v);
      if (i <= 0) break;
      top.unshift(top.splice(i, 1)[0]); S.top = top; render();
      app.querySelector('[data-act="mv"][data-v="0"]')?.focus();
      break;
    }
    case "copy": copy(v); break;
  }
});
document.addEventListener("keydown", e => {
  if ((sheetKey || promptSheet) && e.key === "Escape") { sheetKey = null; promptSheet = false; renderSheet(); return; }
  if (promptSheet) return;
  if (S.step !== "sort" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-4]$/.test(e.key)) { e.preventDefault(); put(PILES[Number(e.key) - 1]); }
  else if (e.key === "Backspace") { e.preventDefault(); undo(); }
});
/* desktop drag-and-drop between piles; touch users move cards with the sheet */
document.addEventListener("dragstart", e => { const c = e.target.closest(".chip"); if (c) e.dataTransfer.setData("text/plain", c.dataset.v); });
document.addEventListener("dragover", e => { const p = e.target.closest(".pile"); if (p) { e.preventDefault(); p.classList.add("drop"); } });
document.addEventListener("dragleave", e => { const p = e.target.closest(".pile"); if (p && !p.contains(e.relatedTarget)) p.classList.remove("drop"); });
document.addEventListener("drop", e => {
  const p = e.target.closest(".pile"); if (!p) return;
  e.preventDefault();
  const k = e.dataTransfer.getData("text/plain");
  if (BY_KEY[k]) { S.piles[k] = Number(p.dataset.pile); syncTop(); render(); }
});

render();
</script>
</body>
</html>
